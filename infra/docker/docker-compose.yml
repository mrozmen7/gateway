services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.5.3
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/banking

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  identity-service:
    build: ../../services/identity-service
    ports:
      - "8081:8081"

  customer-service:
    build: ../../services/customer-service
    ports:
      - "8083:8083"

  account-service:
    build: ../../services/account-service
    ports:
      - "8082:8082"

  transaction-service:
    build: ../../services/transaction-service
    depends_on:
      - account-service
      - customer-service
      - audit-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      AUDIT_SERVICE_URL: http://audit-service:8086
    ports:
      - "8084:8084"

  payment-service:
    build: ../../services/payment-service
    depends_on:
      - account-service
      - customer-service
      - audit-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      AUDIT_SERVICE_URL: http://audit-service:8086
    ports:
      - "8085:8085"

  audit-service:
    build: ../../services/audit-service
    ports:
      - "8086:8086"

  risk-service:
    build: ../../services/risk-service
    depends_on:
      - kafka
      - redis
    environment:
      RISK_SERVICE_NAME: risk-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_EVENTS_TOPIC: api-events
      KAFKA_GROUP_ID: risk-service
      RISK_EVENT_BUFFER_SIZE: 200
      REDIS_URL: redis://redis:6379/0
      RISK_FEATURE_WINDOW_SECONDS: 300
    ports:
      - "8091:8091"

  api-gateway:
    build: ../../services/api-gateway
    depends_on:
      - identity-service
      - account-service
      - customer-service
      - transaction-service
      - payment-service
      - audit-service
    environment:
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      AUDIT_SERVICE_URL: http://audit-service:8086
      PROMETHEUS_URL: http://prometheus:9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      LOG_FILE_PATH: /var/log/banking/api-gateway.log
    volumes:
      - ./logs:/var/log/banking
    ports:
      - "8090:8080"

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
