spring.application.name=payment-service
server.port=8085

bank.security.jwt.secret=phase3-banking-shared-secret-change-in-prod-2026
bank.security.jwt.issuer=bank-platform-identity
bank.internal.api-key=phase5-internal-service-key-change-in-prod-2026
bank.services.account-service.url=http://localhost:8082
bank.services.customer-service.url=http://localhost:8083
bank.services.audit-service.url=http://localhost:8086
bank.services.http.timeout-millis=2000
bank.services.http.max-attempts=2
spring.datasource.url=jdbc:h2:file:./data/payment-service-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.document-title=Payment Swagger

management.endpoints.web.exposure.include=health,info
